name: Scrape DR Listings

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated listings.json
        run: |
          git config user.name  "DR Realty Bot"
          git config user.email "bot@dr-realty.local"
          git add docs/listings.json
          git diff --staged --quiet || git commit -m "🌴 Update listings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
